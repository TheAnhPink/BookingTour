spring.application.name=backend


server.port=8080

# ===== MariaDB =====
spring.datasource.url=jdbc:mariadb://localhost:3306/bookingtour_final
spring.datasource.username=root
spring.datasource.password=sapassword

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Giữ nguyên tên bảng viết hoa như trong Entity
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

#true giữ kết nối DB đến lúc trả JSON
# false đóng kết nối ngay sau tầng Service
spring.jpa.open-in-view=false

# ===== JWT =====
# Khoa bi mat Base64, toi thieu 256 bit (32 byte)
app.jwt.secret=N45bb7tsq8gOEJgSwlOh2QJ88qa66XO66l2+9pGjnM/YI0zwef4ob8hrFuifheOM
# Thoi han token: 1 ngay (tinh bang mili giay)
app.jwt.expiration-ms=86400000

# (Tuy chon) Bat log de debug Spring Security
logging.level.org.springframework.security=DEBUG

